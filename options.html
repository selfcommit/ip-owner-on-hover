<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>IP Owner on Hover</title>
<style>
  :root {
    color-scheme: light dark;
    --ink: #1c2833; --soft: #5a6b7a; --surface: #ffffff; --line: #c9d3dc; --action: #1f6f68;
  }
  @media (prefers-color-scheme: dark) {
    :root { --ink: #e8eef3; --soft: #a3b4c2; --surface: #1e2a35; --line: #40505e; --action: #86d3c9; }
  }
  body { font: 14px/1.5 system-ui, sans-serif; color: var(--ink); background: var(--surface);
         margin: 0; padding: 18px 20px 22px; min-width: 420px; max-width: 520px; }
  label { display: block; font-weight: 600; margin-bottom: 4px; }
  p { margin: 0 0 12px; color: var(--soft); }
  input { width: 100%; box-sizing: border-box; padding: 7px 9px; font: inherit;
          font-family: ui-monospace, Menlo, Consolas, monospace;
          color: var(--ink); background: transparent; border: 1px solid var(--line); border-radius: 5px; }
  .row { display: flex; gap: 8px; align-items: center; margin-top: 12px; }
  button { font: inherit; padding: 6px 12px; border-radius: 5px; cursor: pointer;
           border: 1px solid var(--line); background: transparent; color: var(--ink); }
  button.primary { background: var(--action); border-color: var(--action); color: var(--surface); font-weight: 600; }
  a { color: var(--action); }
  :focus-visible { outline: 2px solid var(--action); outline-offset: 2px; }
  #status { color: var(--soft); }
</style>
</head>
<body>
  <label for="token">IPinfo token</label>
  <p>Lookups are free and unlimited with a token from a free
     <a href="https://ipinfo.io/signup" target="_blank" rel="noopener">IPinfo account</a>.
     Without one, lookups are rate-limited.</p>
  <input id="token" type="text" autocomplete="off" spellcheck="false" placeholder="Paste your token">
  <div class="row">
    <button class="primary" id="save">Save token</button>
    <button id="clear">Clear cached lookups</button>
    <span id="status" role="status"></span>
  </div>
  <script src="options.js"></script>
</body>
</html>
